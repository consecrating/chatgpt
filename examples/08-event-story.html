<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  html, body { margin: 0; padding: 0; }
  .canvas {
    position: relative;
    width: 1080px; height: 1920px;
    background: linear-gradient(135deg,#2A0E3A 0%,#7A1E52 55%,#FF6B3D 100%);
    overflow: hidden;
  }
  .stage {
    position: relative;
    z-index: 2;
    width: 100%; height: 100%;
    padding: 81px;
    display: flex; flex-direction: column;
    gap: 32px;
  }
  .content { flex: 1; display: flex; min-height: 0; overflow: hidden; }
  .content > div { width: 100%; }
  .brandbar { display:flex; align-items:center; justify-content: space-between; }
</style>
</head>
<body>
  <div class="canvas" id="canvas">
    <div style="position:absolute;left:-130px;top:-108px;width:540px;height:540px;
    background:#FF477E;opacity:0.28;border-radius:50%;
    filter:blur(245px);"></div><div style="position:absolute;left:670px;top:1267px;width:594px;height:594px;
    background:#FFC93C;opacity:0.22;border-radius:50%;
    filter:blur(270px);"></div>
    <div class="stage">
      <div class="content">
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:32px;height:100%;">
    <div style="display:inline-flex;align-items:center;gap:15px;
    align-self:center;
    padding:17px 32px;border-radius:999px;
    background:#FF477E;color:#1A0B1F;
    font-family:'Archivo', sans-serif;font-weight:600;letter-spacing:0.14em;
    text-transform:uppercase;font-size:22px;">
    YOU'RE INVITED
  </div>
    <h1 style="margin:0;font-family:'Clash Display', 'Archivo', sans-serif;font-weight:700;
      font-size:151px;line-height:0.98;letter-spacing:-0.02em;color:#FFF0FA;
      max-width:88%;">Founders Night <span style="color:#FFC93C;">2026</span></h1>
    <p style="margin:0;max-width:74%;font-family:'Archivo', sans-serif;
             font-size:41px;line-height:1.4;color:#D2A6C8;">March 14 · 7PM · Downtown. Limited seats.</p>
    <div style="margin-top:22px;"><div style="display:inline-flex;align-items:center;gap:17px;
    padding:26px 45px;border-radius:999px;
    background:#FFC93C;color:#0B0B0B;
    font-family:'Archivo', sans-serif;font-weight:600;
    font-size:35px;box-shadow:0 24px 70px rgba(0,0,0,0.55);">
    Grab a ticket
    <svg width="35" height="35" viewBox="0 0 24 24" fill="none"
      style="display:block;"><path d="M5 12h14M13 6l6 6-6 6" stroke="#0B0B0B"
      stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div></div>
  </div></div>
      <div class="brandbar">
        <div style="display:flex;align-items:center;gap:22px;
    font-family:'Archivo', sans-serif;color:#D2A6C8;
    font-size:26px;font-weight:500;">
    <span style="width:30px;height:30px;border-radius:50%;
      background:#FFC93C;display:inline-block;"></span>
    @citystartups
  </div>
        <div style="display:flex;gap:13px;align-items:center;opacity:0.7;">
          <span style="width:22px;height:22px;border-radius:50%;background:#D2A6C8;"></span>
          <span style="width:22px;height:22px;border-radius:50%;background:#D2A6C8;"></span>
          <span style="width:22px;height:22px;border-radius:50%;background:#FFC93C;"></span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
