<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  html, body { margin: 0; padding: 0; }
  .canvas {
    position: relative;
    width: 1080px; height: 1350px;
    background: linear-gradient(135deg,#F6F1E7 0%,#F0E4D2 100%);
    overflow: hidden;
  }
  .stage {
    position: relative;
    z-index: 2;
    width: 100%; height: 100%;
    padding: 81px;
    display: flex; flex-direction: column;
    gap: 32px;
  }
  .content { flex: 1; display: flex; min-height: 0; overflow: hidden; }
  .content > div { width: 100%; }
  .brandbar { display:flex; align-items:center; justify-content: space-between; }
</style>
</head>
<body>
  <div class="canvas" id="canvas">
    <div style="position:absolute;left:-130px;top:-108px;width:540px;height:540px;
    background:#C8613B;opacity:0.18;border-radius:50%;
    filter:blur(245px);"></div><div style="position:absolute;left:670px;top:891px;width:594px;height:594px;
    background:#2E5E4E;opacity:0.14;border-radius:50%;
    filter:blur(270px);"></div>
    <div class="stage">
      <div class="content">
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:38px;height:100%;">
    <div style="font-family:'Fraunces', serif;color:#2E5E4E;
      font-size:238px;line-height:0.6;font-weight:600;">&ldquo;</div>
    <h1 style="margin:0;font-family:'Fraunces', serif;font-weight:600;
      font-style:italic;
      font-size:124px;line-height:1.08;letter-spacing:-0.01em;color:#241C15;
      max-width:90%;">Design is intelligence made visible.</h1>
    <p style="margin:0;font-family:'Inter', sans-serif;font-weight:600;
             font-size:35px;letter-spacing:0.08em;text-transform:uppercase;
             color:#7A6E5F;">Alina Wheeler</p>
  </div></div>
      <div class="brandbar">
        
        <div style="display:flex;gap:13px;align-items:center;opacity:0.7;">
          <span style="width:22px;height:22px;border-radius:50%;background:#7A6E5F;"></span>
          <span style="width:22px;height:22px;border-radius:50%;background:#7A6E5F;"></span>
          <span style="width:22px;height:22px;border-radius:50%;background:#2E5E4E;"></span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
