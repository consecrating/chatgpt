<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  html, body { margin: 0; padding: 0; }
  .canvas {
    position: relative;
    width: 1080px; height: 1080px;
    background: linear-gradient(135deg,#0B0F0A 0%,#12200C 55%,#1C3310 100%);
    overflow: hidden;
  }
  .stage {
    position: relative;
    z-index: 2;
    width: 100%; height: 100%;
    padding: 81px;
    display: flex; flex-direction: column;
    gap: 32px;
  }
  .content { flex: 1; display: flex; min-height: 0; overflow: hidden; }
  .content > div { width: 100%; }
  .brandbar { display:flex; align-items:center; justify-content: space-between; }
</style>
</head>
<body>
  <div class="canvas" id="canvas">
    <div style="position:absolute;left:-130px;top:-108px;width:540px;height:540px;
    background:#C6F432;opacity:0.28;border-radius:50%;
    filter:blur(245px);"></div><div style="position:absolute;left:670px;top:713px;width:594px;height:594px;
    background:#7CFF6B;opacity:0.22;border-radius:50%;
    filter:blur(270px);"></div>
    <div class="stage">
      <div class="content">
  <div style="display:flex;flex-direction:column;justify-content:center;gap:32px;height:100%;">
    <div style="display:inline-flex;align-items:center;gap:15px;
    align-self:flex-start;
    padding:17px 32px;border-radius:999px;
    background:#C6F432;color:#0B0F0A;
    font-family:'Inter', sans-serif;font-weight:600;letter-spacing:0.14em;
    text-transform:uppercase;font-size:22px;">
    CASE STUDY
  </div>
    <div style="font-family:'Space Grotesk', sans-serif;font-weight:700;
      font-size:302px;line-height:0.9;letter-spacing:-0.03em;color:#7CFF6B;">
      +312%
    </div>
    <h1 style="margin:0;font-family:'Space Grotesk', sans-serif;font-weight:700;
      font-size:86px;line-height:1.02;letter-spacing:-0.02em;color:#F4FFE9;
      max-width:92%;">activation in the first 90 days</h1>
    <p style="margin:0;max-width:82%;font-family:'Inter', sans-serif;
             font-size:41px;line-height:1.45;color:#A6B79A;">How we rebuilt the first-run experience from scratch.</p>
    
  </div></div>
      <div class="brandbar">
        <div style="display:flex;align-items:center;gap:22px;
    font-family:'Inter', sans-serif;color:#A6B79A;
    font-size:26px;font-weight:500;">

      background:#7CFF6B;display:inline-block;"></span>

    </div>
